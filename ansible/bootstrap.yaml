---
# This playbook bootstrap a fresh CentOS Stream 10 system.
#
# Usage:
#   ansible-playbook bootstrap.yaml
#
# note: the inventory is inside inventories/ and the default is declared in ansible.cfg
#
# Iván Chavero <ivan@nortk.com>
#

- name: Configure CentOS Stream 10 Systems
  hosts: cs10
  user: root
  become: true
  roles:
    - common
    - users
