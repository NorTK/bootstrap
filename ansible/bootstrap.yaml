---
# This playbook bootstrap a fresh CentOS Stream 10 system.
#
# Usage:
#   ansible-playbook bootstrap.yaml
#
# note: the inventory is inside inventories/ and the default is declared in ansible.cfg
#
# Iván Chavero <ivan@nortk.com>
#

- name: Configure CentOS Stream 10 Systems
  hosts: cs10
  user: root
  become: true
  vars:
    tpm_repo_url: "https://github.com/tmux-plugins/tpm"
    tpm_install_path: "{{ ansible_user_dir }}/.tmux/plugins/tpm"
    users:
      - douglax
      - imcsk8
      - renich
    user_groups:
      - users
    user_config_files:
      - .vimrc
  roles:
    - users
  tasks:

    - name: Ensure the crb repository is enabled
      community.general.dnf_config_manager:
        name: crb
        state: enabled

    - name: Install EPEL
      ansible.builtin.dnf:
        name: epel-release

    - name: Install required packages
      ansible.builtin.dnf:
        name:
          - fail2ban
          - tmux
          - git
          - podman
        state: present

    - name: Copy nortk_env.sh to /etc/profile.d/
      ansible.builtin.copy:
        src: files/nortk_env.sh   # Path to the file on the Ansible control node
        dest: /etc/profile.d/nortk_env.sh   # Destination on the target server
        owner: root
        group: root
        mode: '0755'

    - name: Ensure .tmux plugins directory exists for the connecting user
      ansible.builtin.file:
        path: "{{ ansible_user_dir }}/.tmux/plugins"
        state: directory
        mode: '0755'

    - name: Install tpm (Tmux Plugin Manager)
      ansible.builtin.git:
        repo: "{{ tpm_repo_url }}"
        dest: "{{ tpm_install_path }}"
        clone: true
        update: true

    - name: Copy tmux.conf
      ansible.builtin.copy:
        src: files/tmux.conf
        dest: "{{ ansible_user_dir }}/.tmux.conf"
        owner: root
        group: root
        mode: '0755'

    - name: Copy Fail2Ban local configuration
      ansible.builtin.copy:
        src: files/jail.local
        dest: /etc/fail2ban/jail.local
        owner: root
        group: root
        mode: '0644'

    - name: Ensure Fail2Ban service is enabled and running
      ansible.builtin.service:
        name: fail2ban
        enabled: true
        state: restarted

    # Disable TCP Timestamps
    - ansible.posix.sysctl:
        name: net.ipv4.tcp_timestamps
        value: '0'
        sysctl_set: true
        reload: true

    - name: Ensure FirewallD is active
      ansible.builtin.service:
        name: firewalld
        enabled: yes
        state: restarted


