---
- name: Create groups
  ansible.builtin.group:
    name: '{{ item }}'
    state: present
  loop: '{{ user_groups }}'

- name: Create users
  ansible.builtin.user:
    name: '{{ item }}'
    groups:
      - adm
      - users
      - wheel
    append: true
    state: present
  loop: '{{ users }}'

- name: Set authorized keys
  ansible.posix.authorized_key:
    user: '{{ item }}'
    key: "{{ lookup('file', 'files/ssh/{{ item }}.pub') }}"
    state: present
  loop: '{{ users }}'

- name: Copy configuration files
  ansible.builtin.copy:
    src: '{{ item[1] }}'
    dest: /home/{{ item[0] }}/{{ item[1] }}
    owner: '{{ item[0] }}'
    group: '{{ item[0] }}'
    mode: '0600'
  loop: '{{ users | product( user_config_files ) | list }}'

- name: Set infinite history
  ansible.builtin.copy:
    content: |
      export HISTSIZE=-1
      export HISTFILESIZE=-1
      export HISTCONTROL=ignoredups
    dest: /etc/profile.d/history.sh
    owner: root
    group: root
    mode: '0644'
